server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/webar;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/webar;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/120.53.225.3/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/120.53.225.3/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;
    charset utf-8;

    add_header Permissions-Policy "camera=(self), microphone=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|glb|gltf|bin|mp3|wav|ogg|mp4|webm|zip)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Permissions-Policy "camera=(self), microphone=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
