<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>AR.js 官方最小测试</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/vendor/arjs/aframe-ar.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "STXingkai", "KaiTi", serif;
        background: #000;
      }

      .status {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        max-width: 72vw;
        padding: 10px 14px;
        border: 1px solid rgba(255, 179, 90, 0.54);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff5df;
        font-size: 22px;
        line-height: 1.35;
      }
    </style>
    <script>
      window.addEventListener('camera-init', () => {
        document.querySelector('#status').textContent = '摄像头已启动，扫描 Hiro 或 Kanji';
      });

      window.addEventListener('camera-error', () => {
        document.querySelector('#status').textContent = '摄像头启动失败，请检查权限和 HTTPS';
      });

      AFRAME.registerComponent('registerevents', {
        init() {
          const marker = this.el;
          marker.addEventListener('markerFound', () => {
            document.querySelector('#status').textContent = `识别成功：${marker.id}`;
          });
          marker.addEventListener('markerLost', () => {
            document.querySelector('#status').textContent = `已丢失：${marker.id}`;
          });
        }
      });
    </script>
  </head>
  <body>
    <div id="status" class="status">等待摄像头...</div>
    <a-scene
      embedded
      renderer="precision: medium; logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    >
      <a-marker preset="hiro" id="marker-hiro" registerevents>
        <a-box position="0 0.5 0" material="opacity: 0.65; side: double; color: #ff4f37;">
          <a-torus-knot
            radius="0.26"
            radius-tubular="0.05"
            animation="property: rotation; to: 360 0 0; dur: 5000; easing: linear; loop: true"
          ></a-torus-knot>
        </a-box>
      </a-marker>
      <a-marker preset="kanji" id="marker-kanji" registerevents>
        <a-box position="0 0.5 0" material="opacity: 0.65; side: double; color: #33d17a;">
          <a-torus-knot
            radius="0.26"
            radius-tubular="0.05"
            animation="property: rotation; to: 360 0 0; dur: 5000; easing: linear; loop: true"
          ></a-torus-knot>
        </a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
